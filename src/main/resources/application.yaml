server:
  port: 8080
spring:
  application:
    name: portfolio-api
  datasource:
    url: jdbc:postgresql://localhost:5432/ad_db
    username: ad_java
    password: ad_java
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:8080"
  security:
    jwt-secret: "your-secret-key-change-in-production"
    jwt-expiration-ms: 86400000
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html